[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vertex-clips"
description = "Game clip recorder, library, editor and Sonar-style audio router for Linux"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vertex contributors" }]
keywords = ["clips", "gpu-screen-recorder", "pipewire", "replay", "moments", "sonar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "PySide6>=6.5",
    "python-mpv>=1.0.4",
    "Send2Trash>=1.8",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
vertex = "vertex.cli:main"

[project.urls]
Homepage = "https://github.com/StellarGalaxyAtlas/vertex"
Issues = "https://github.com/StellarGalaxyAtlas/vertex/issues"

[tool.setuptools.dynamic]
version = { attr = "vertex.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vertex = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "pipewire: needs a running PipeWire/PulseAudio server reachable through pactl",
    "ffmpeg: needs ffmpeg and ffprobe on PATH",
    "gui: needs PySide6 (runs with the offscreen platform)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # the UI deliberately uses typographic characters (×, –, …)
    "RUF002",
    "RUF003",
    "SIM105",  # contextlib.suppress is not clearer than try/except/pass here
]

[tool.ruff.lint.isort]
known-first-party = ["vertex"]
known-local-folder = ["fake_pactl"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
